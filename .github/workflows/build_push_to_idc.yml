name: build_push_to_idc

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: main, moi-dev, or a full commit SHA contained in either branch
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: build-push-to-idc
  cancel-in-progress: false

jobs:
  settings:
    name: Validate IDC build configuration
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      image_version: ${{ steps.resolve.outputs.image_version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      controller_sha: ${{ steps.resolve.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve IDC target and immutable build identity
        id: resolve
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REF: ${{ inputs.source_ref }}
          IDC_REGISTRY: ${{ vars.CONTAINER_MIRROR_REGISTRY }}
          IDC_IMAGE: ${{ vars.CONTAINER_MIRROR_IMAGE }}
          IDC_RUNNER: ${{ vars.CONTAINER_MIRROR_RUNNER }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run this workflow from ${DEFAULT_BRANCH}; use source_ref to select build source."
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "refs/heads/moi-dev:refs/remotes/origin/moi-dev"
          controller_sha="$(git rev-parse HEAD)"
          default_sha="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          if [ "${controller_sha}" != "${default_sha}" ]; then
            echo "::error::The IDC controller must be the current ${DEFAULT_BRANCH} head."
            exit 1
          fi

          case "${SOURCE_REF}" in
            main|moi-dev)
              source_sha="$(git rev-parse "refs/remotes/origin/${SOURCE_REF}")"
              source_ref="${SOURCE_REF}"
              ;;
            *)
              if [[ ! "${SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::source_ref must be main, moi-dev, or a full commit SHA."
                exit 1
              fi
              source_sha="$(printf '%s' "${SOURCE_REF}" | tr 'A-F' 'a-f')"
              git cat-file -e "${source_sha}^{commit}" 2>/dev/null || {
                echo "::error::source_ref commit was not found in the repository."
                exit 1
              }
              if ! git merge-base --is-ancestor "${source_sha}" refs/remotes/origin/main \
                && ! git merge-base --is-ancestor "${source_sha}" refs/remotes/origin/moi-dev; then
                echo "::error::source_ref commit must belong to main or moi-dev."
                exit 1
              fi
              source_ref="${source_sha}"
              ;;
          esac

          for key in IDC_REGISTRY IDC_IMAGE IDC_RUNNER; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required IDC configuration: ${key}"
              exit 1
            fi
          done
          if [[ "${IDC_REGISTRY}" == */* || "${IDC_REGISTRY}" == *[[:space:]]* ]]; then
            echo "::error::IDC registry must be a hostname with an optional port, without a URL scheme."
            exit 1
          fi
          if [[ "${IDC_IMAGE}" != "${IDC_REGISTRY}/"* || "${IDC_IMAGE}" == *[[:space:]]* || "${IDC_IMAGE}" == *@* || "${IDC_IMAGE#*/}" == *:* || -z "${IDC_IMAGE#*/}" ]]; then
            echo "::error::IDC image must be an untagged repository under the configured IDC registry."
            exit 1
          fi
          matrix="$(jq -cn --arg runner "${IDC_RUNNER}" '{include:[{platform:"linux/amd64",runner:$runner,slug:"linux-amd64"}]}')"
          {
            echo "matrix=${matrix}"
            echo "controller_sha=${controller_sha}"
            echo "source_sha=${source_sha}"
            echo "source_ref=${source_ref}"
            echo "image_version=idc-$(date -u +%Y%m%dT%H%M%SZ)-${source_sha}-${GITHUB_RUN_ID}-amd64"
          } >> "${GITHUB_OUTPUT}"

  credentials:
    name: Validate IDC registry credentials
    needs: settings
    runs-on: ${{ vars.CONTAINER_MIRROR_RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Require a self-hosted IDC runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [ "${RUNNER_ENVIRONMENT}" != "self-hosted" ]; then
            echo "::error::IDC credential validation requires a self-hosted runner."
            exit 1
          fi
      - name: Require IDC registry credentials
        shell: bash
        env:
          IDC_REGISTRY_USERNAME: ${{ secrets.IDC_REGISTRY_USERNAME }}
          IDC_REGISTRY_PASSWORD: ${{ secrets.IDC_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in IDC_REGISTRY_USERNAME IDC_REGISTRY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required IDC credential: ${key}"
              exit 1
            fi
          done

  candidates:
    name: Build and verify IDC image
    needs: [settings, credentials]
    uses: ./.github/workflows/release-container-candidates.yml
    with:
      image_version: ${{ needs.settings.outputs.image_version }}
      controller_sha: ${{ needs.settings.outputs.controller_sha }}
      source_sha: ${{ needs.settings.outputs.source_sha }}
      source_ref: ${{ needs.settings.outputs.source_ref }}
      matrix_json: ${{ needs.settings.outputs.matrix }}
      registry: ${{ vars.CONTAINER_MIRROR_REGISTRY }}
      image_name: ${{ vars.CONTAINER_MIRROR_IMAGE }}
      http_proxy: ${{ vars.CONTAINER_MIRROR_HTTP_PROXY }}
      https_proxy: ${{ vars.CONTAINER_MIRROR_HTTPS_PROXY }}
      no_proxy: ${{ vars.CONTAINER_MIRROR_NO_PROXY }}
      require_self_hosted: true
      retain_candidate_tag: false
      use_registry_cache: false
    secrets:
      REGISTRY_USERNAME: ${{ secrets.IDC_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.IDC_REGISTRY_PASSWORD }}

  publish:
    name: Publish verified IDC image
    needs: [settings, candidates]
    runs-on: ${{ vars.CONTAINER_MIRROR_RUNNER }}
    timeout-minutes: 20
    env:
      http_proxy: ${{ vars.CONTAINER_MIRROR_HTTP_PROXY }}
      https_proxy: ${{ vars.CONTAINER_MIRROR_HTTPS_PROXY }}
      no_proxy: ${{ vars.CONTAINER_MIRROR_NO_PROXY }}
    steps:
      - name: Require a self-hosted IDC runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [ "${RUNNER_ENVIRONMENT}" != "self-hosted" ]; then
            echo "::error::IDC publication requires a self-hosted runner."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.settings.outputs.controller_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-digest-*
          path: ${{ runner.temp }}/idc-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CONTAINER_MIRROR_REGISTRY }}
          username: ${{ secrets.IDC_REGISTRY_USERNAME }}
          password: ${{ secrets.IDC_REGISTRY_PASSWORD }}
      - name: Publish or verify immutable IDC manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ vars.CONTAINER_MIRROR_IMAGE }}
          IMAGE_VERSION: ${{ needs.settings.outputs.image_version }}
          BUILD_MATRIX_JSON: ${{ needs.settings.outputs.matrix }}
        run: |
          set -euo pipefail
          scripts/reconcile-docker-manifest.sh \
            "${IMAGE_NAME}" "${IMAGE_VERSION}" "${BUILD_MATRIX_JSON}" \
            "${RUNNER_TEMP}/idc-digests" verify
          {
            echo "## IDC image published"
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_VERSION}\`"
            echo "- Source: \`${{ needs.settings.outputs.source_sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
